<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIIT App</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="navbar">
        <a href="index.html">Home</a>
        <a class="active" href="hiit.html">Exercise</a>
        <a href="create.html">Create</a>
        <a href="myWorkouts.html">Saved</a>

      </div>
    <div class="top">
        <section id="stopwatch">
            <h1 id="currentlySelected">Currently Selected Exercise: </h1>
            <h2 id="restMessage">Select an exercise and press start!</h2>
            <div id="time">
                <div id="progressBarContainer" style="width: 100%; background-color: #f3f3f3;">
                    <div id="progressBar"></div>
                  </div>
                <span class="digit" id="min">
                    00</span>
                <span class="txt">Min</span>
                <span class="digit" id="sec">
                    00</span>
                <span class="txt">Sec</span>
                <span class="digit" id="ms">
                    00</span>
            </div>
            <button type="button" id="start">Start/Pause Timer</button>
            <button type="button" id="reset">Reset Timer</button>
            <button type="button" id="save">Save</button>
            <button type="button" id="clear">Clear</button>
        </section>

        <section id="exercises">
            <h1>My Exercises</h1>
            <ul id=exerciselist>
            </ul>
        </section>
    </div>
    <section id="addexercise"></section>





    
    <script src="script.js"></script>
</body>

</html>
